services:
  postgres:
    image: postgres:16
    container_name: pristinenest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pristinenest_user
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: pristinenest
    ports:
      - "5432:5432"
    volumes:
      - pristinenest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pristinenest_user -d pristinenest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pristinenest_pgdata:
